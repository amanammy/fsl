name: SAREF Pypeline Validation

on:
  push:
    branches: [ main, saref-compatibility ]
  pull_request:
    branches: [ main ]

jobs:
  saref-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout FSL
        uses: actions/checkout@v4

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Clone saref-pypeline
        run: git clone https://labs.etsi.org/rep/saref/saref-pypeline.git

      - name: Build saref-pypeline Docker image
        run: |
          cd saref-pypeline
          docker build -t saref-pypeline .

      - name: Create metadata file
        run: |
          mkdir -p target/sources
          echo "projects: []" > target/sources/projects_metadata.yaml

      - name: Run SAREF validation
        run: |
          docker run --rm \
            -v "$(pwd):/saref" \
            saref-pypeline saref-dev check --skip-fetch /saref 2>&1 | tee saref-output.txt
          if grep -q "ERROR" saref-output.txt; then
            echo "SAREF validation found errors — see report above"
            exit 1
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saref-validation-report
          path: |
            saref-output.txt
            target/
